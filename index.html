<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Flappy Deluxe v24</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0f1a;
      font-family: Arial, sans-serif;
      overflow: hidden;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: none;
    }
    #wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    canvas {
      display: block;
      box-sizing: border-box;
      border: 3px solid #222;
      border-radius: 10px;
      touch-action: none;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    /* Edge-to-edge on small/phone screens - true fullscreen feel, no frame */
    @media (max-width: 640px), (max-height: 640px) {
      canvas {
        border: none;
        border-radius: 0;
        box-shadow: none;
      }
    }
    /* -------------------- LEADERBOARD UI --------------------
     * A trophy button (top-right) opens the leaderboard. A separate modal
     * auto-pops after a run ends so the player can submit their score.
     * Both are plain fixed-position DOM overlays (NOT drawn on the
     * canvas), which keeps them simple, readable at any canvas scale, and
     * immune to the blur/scaling issues fixed for the in-canvas sprites.
     */
    #leaderboardBtn {
      position: absolute;
      top: 9px;
      right: 9px;
      border: 0;
      border-radius: 7px;
      padding: 7px 9px;
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      user-select: none;
      z-index: 5;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      font-family: Arial, sans-serif;
    }
    .modal-box {
      background: #1c2333;
      color: #fff;
      padding: 20px 22px;
      border-radius: 14px;
      width: min(300px, 85vw);
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 10px; }
    .modal-score { font-size: 16px; margin-bottom: 14px; color: #ffce29; }
    #nameInput {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #0e1420;
      color: #fff;
      font-size: 15px;
      margin-bottom: 12px;
    }
    /* Shown instead of the input once a name is already remembered, so
       returning players don't have to retype it every run. */
    #savedNameRow {
      display: none;
      font-size: 14px;
      margin-bottom: 12px;
      color: #cfe8ff;
    }
    #savedNameRow b { color: #fff; }
    #changeNameLink {
      color: #8ab4ff;
      text-decoration: underline;
      cursor: pointer;
      margin-left: 6px;
    }
    .modal-btn-row { display: flex; gap: 8px; }
    .modal-btn-row button {
      flex: 1;
      padding: 9px 0;
      border-radius: 8px;
      border: 0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    #submitScoreBtn { background: #e2001a; color: #fff; }
    #submitScoreBtn:disabled { opacity: 0.6; cursor: default; }
    #skipScoreBtn { background: #333c50; color: #fff; }
    #closeLeaderboardBtn {
      background: #333c50;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 9px 0;
      width: 100%;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .modal-status { font-size: 13px; margin-top: 8px; min-height: 16px; color: #9ad2ff; }
    .modal-list { text-align: left; max-height: 260px; overflow-y: auto; margin: 12px 0; font-size: 14px; }
    .lb-row { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .lb-row:nth-child(odd) { background: rgba(255, 255, 255, 0.03); }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="320" height="480"></canvas>
    <button id="leaderboardBtn">&#127942;</button>
  </div>
  <!-- Auto-opens after a run ends (score > 0): submit to the shared
       Supabase leaderboard. If a name is already remembered, the input
       is hidden and replaced with a quick confirmation line instead. -->
  <div id="scoreModal" class="modal-backdrop">
    <div class="modal-box">
      <div id="scoreModalTitle" class="modal-title">Game Over!</div>
      <div id="scoreModalScore" class="modal-score"></div>
      <div id="savedNameRow">Submitting as <b id="savedNameText"></b><span id="changeNameLink">change</span></div>
      <input id="nameInput" type="text" maxlength="20" placeholder="Your name" autocomplete="off" />
      <div class="modal-btn-row">
        <button id="submitScoreBtn">Submit Score</button>
        <button id="skipScoreBtn">Skip</button>
      </div>
      <div id="submitStatus" class="modal-status"></div>
    </div>
  </div>
  <!-- Opened via the trophy button - shows the top scores from everyone
       who has submitted to this same shared leaderboard, deduped so each
       person's HIGHEST score is the only one shown. -->
  <div id="leaderboardModal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-title">&#127942; Leaderboard</div>
      <div id="leaderboardList" class="modal-list">Loading...</div>
      <button id="closeLeaderboardBtn">Close</button>
    </div>
  </div>
  <script>
    const cv = document.getElementById('c');
    const q = cv.getContext('2d');
    const W = 320, H = 480, GND = 60;
    const GRAVITY = 0.45, FLAP = -7.5, GAP = 125, PW = 54, SPD = 2;
    /* -------------------- RESPONSIVE FULLSCREEN --------------------
     * Internal render resolution stays a crisp 320x480 (all game-logic
     * coordinates untouched). We only scale the CSS display size:
     *  - phone (portrait): scales up to fill almost the entire screen
     *    edge-to-edge (frame/shadow removed via the media query above).
     *  - PC / wide browser window: scales up to fill the full window
     *    height (or width, whichever is the limiting dimension) while
     *    keeping the 320:480 aspect ratio locked, so the art is never
     *    stretched/distorted - any leftover space is simply letterboxed.
     */
    function fitCanvas() {
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth;
      const vh = vv ? vv.height : window.innerHeight;
      const scale = Math.min(vw / W, vh / H);
      cv.style.width = Math.floor(W * scale) + 'px';
      cv.style.height = Math.floor(H * scale) + 'px';
      /* -------------------- HIGH-DPI (RETINA) SHARPNESS --------------------
       * Previously the canvas' actual pixel buffer stayed a fixed 320x480
       * and was just stretched larger via CSS to fill the screen - that
       * stretch (bitmap upscaling) is what blurred fine detail like the
       * license-plate text and the score/"Game Over" text, even though the
       * game's drawing coordinates were untouched. Here we size the REAL
       * pixel buffer to match physical device pixels (CSS size x
       * devicePixelRatio), then rescale the drawing context so all the
       * existing game code - which still thinks in the original 320x480
       * coordinate space - keeps working unchanged, but now renders at
       * full native display resolution instead of being upscaled after
       * the fact.
       */
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const bw = Math.round(W * scale * dpr);
      const bh = Math.round(H * scale * dpr);
      if (cv.width !== bw || cv.height !== bh) {
        cv.width = bw;
        cv.height = bh;
      }
      q.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    }
    window.addEventListener('resize', fitCanvas);
    window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', fitCanvas);
    fitCanvas();
    let y, v, pipes, score, mode, frame = 0, gOff = 0, clouds, shake = 0;
    let lastTime = null, dt = 1;
    let birdAngle = 0;
    let best = +(localStorage.flappyBest || 0);
    /* -------------------- SUPABASE LEADERBOARD --------------------
     * Supabase gives every project a free hosted Postgres database with
     * an auto-generated REST API - reachable with plain fetch() calls,
     * no SDK/script tag needed, keeping this a single self-contained
     * HTML file. Swapped in after CheddaBoards.com got flagged by the
     * office's Zscaler web filter as "Miscellaneous/Unknown."
     *
     * NOTE: the "anon public" / "publishable" key below is SAFE to embed
     * in client-side code and share - it can only do what your Row Level
     * Security policies allow (insert + read on the scores table). Your
     * actual Supabase ACCOUNT password should never appear in this file
     * or any comment in it.
     */
    const SUPABASE_URL = 'https://zcikcybrulwhbclsjjhb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_3bdAzSXPbVeS6w0MD_S2sA_GapTsNB5';

    async function submitScoreToSupabase(nickname, scoreValue) {
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/scores', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({ name: nickname, score: scoreValue })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return true;
      } catch (err) {
        console.error('Supabase submit failed:', err);
        return false;
      }
    }

    async function fetchLeaderboard() {
      try {
        /* -------------------- DEDUPE BY NAME (SHOW ONLY EACH PLAYER'S BEST) --------------------
         * Supabase's REST API doesn't do a "GROUP BY highest score per
         * name" in one simple call without writing a SQL view/RPC, so we
         * pull a larger pool (top 200 rows, already sorted highest-first)
         * and then dedupe client-side: since the rows arrive in
         * descending score order, the FIRST time we encounter a given
         * name is automatically that person's highest score. Every
         * later (lower) row for that same name is simply skipped.
         * Names are compared trimmed + lowercased so "Peter" and "peter "
         * are treated as the same person.
         */
        const url = SUPABASE_URL + '/rest/v1/scores?select=name,score&order=score.desc&limit=200';
        const res = await fetch(url, {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
          }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json(); // Supabase returns a plain JSON array of rows.
        const seen = new Set();
        const deduped = [];
        for (const row of rows) {
          const key = (row.name || '').trim().toLowerCase();
          if (!key || seen.has(key)) continue;
          seen.add(key);
          deduped.push(row);
          if (deduped.length >= 10) break;
        }
        return deduped;
      } catch (err) {
        console.error('Supabase fetch failed:', err);
        return null;
      }
    }

    // ---- DOM wiring for the two modals ----
    const leaderboardBtn = document.getElementById('leaderboardBtn');
    const scoreModal = document.getElementById('scoreModal');
    const scoreModalScore = document.getElementById('scoreModalScore');
    const nameInput = document.getElementById('nameInput');
    const submitScoreBtn = document.getElementById('submitScoreBtn');
    const skipScoreBtn = document.getElementById('skipScoreBtn');
    const submitStatus = document.getElementById('submitStatus');
    const leaderboardModal = document.getElementById('leaderboardModal');
    const leaderboardList = document.getElementById('leaderboardList');
    const closeLeaderboardBtn = document.getElementById('closeLeaderboardBtn');
    const scoreModalTitle = document.getElementById('scoreModalTitle');
    const savedNameRow = document.getElementById('savedNameRow');
    const savedNameText = document.getElementById('savedNameText');
    const changeNameLink = document.getElementById('changeNameLink');

    nameInput.value = localStorage.flappyName || '';

    /* -------------------- REMEMBERED NAME UX --------------------
     * If a name was saved from a previous submission, hide the text input
     * entirely and show a compact "Submitting as <name>" confirmation
     * instead - so returning players never have to retype it. A small
     * "change" link swaps back to the editable input for anyone who
     * wants to submit under a different name (e.g. testing, or someone
     * else playing on the same device).
     */
    function refreshNameRowUI() {
      const saved = localStorage.flappyName;
      if (saved) {
        savedNameText.textContent = saved;
        savedNameRow.style.display = 'block';
        nameInput.style.display = 'none';
      } else {
        savedNameRow.style.display = 'none';
        nameInput.style.display = 'block';
      }
    }
    changeNameLink.onclick = (e) => {
      e.stopPropagation();
      savedNameRow.style.display = 'none';
      nameInput.style.display = 'block';
      nameInput.value = localStorage.flappyName || '';
      nameInput.focus();
    };
    refreshNameRowUI();

    // Tracks WHICH score the currently-open modal should submit, since the
    // same modal/buttons are reused for two different situations below.
    let pendingScoreToSubmit = 0;
    // True only while the one-time "submit your existing best" prompt
    // (added for the leaderboard rollout) is showing, so we know to mark
    // it as handled once the player submits or skips it.
    let isExistingBestPrompt = false;

    function openScoreModal(finalScore) {
      isExistingBestPrompt = false;
      pendingScoreToSubmit = finalScore;
      scoreModalTitle.textContent = 'Game Over!';
      scoreModalScore.textContent = 'You scored ' + finalScore + '!';
      submitStatus.textContent = '';
      submitScoreBtn.disabled = false;
      submitScoreBtn.textContent = 'Submit Score';
      refreshNameRowUI();
      scoreModal.style.display = 'flex';
    }
    function closeScoreModal() { scoreModal.style.display = 'none'; }

    /* -------------------- ONE-TIME "SUBMIT EXISTING BEST" PROMPT --------------------
     * Anyone updating from a pre-leaderboard version of the file already
     * has a personal best sitting in localStorage that would otherwise
     * never reach the shared board unless they happened to beat it again.
     * On first load of THIS version, if a best score exists and hasn't
     * been offered up yet, we prompt once to submit it - so nobody loses
     * credit for scores they already earned. Skipping or submitting both
     * mark it as handled (localStorage.flappyBestPrompted) so this only
     * ever appears a single time per device.
     */
    function maybePromptExistingBest() {
      if (localStorage.flappyBestPrompted) return;
      if (!best || best <= 0) return;
      isExistingBestPrompt = true;
      pendingScoreToSubmit = best;
      scoreModalTitle.textContent = 'Welcome to the leaderboard!';
      scoreModalScore.textContent = 'Your existing best is ' + best + ' - submit it?';
      submitStatus.textContent = '';
      submitScoreBtn.disabled = false;
      submitScoreBtn.textContent = 'Submit Score';
      refreshNameRowUI();
      scoreModal.style.display = 'flex';
    }

    function getNameToSubmit() {
      // Prefer whatever is currently typed in the input if it's visible
      // and non-empty; otherwise fall back to the remembered name shown
      // in the "Submitting as X" confirmation row.
      const typed = nameInput.value.trim();
      if (nameInput.style.display !== 'none' && typed) return typed;
      return (localStorage.flappyName || '').trim();
    }

    submitScoreBtn.onclick = async (e) => {
      e.stopPropagation();
      const nm = getNameToSubmit();
      if (nm.length < 2) {
        submitStatus.textContent = 'Enter a name (2+ characters).';
        return;
      }
      localStorage.flappyName = nm;
      submitScoreBtn.disabled = true;
      submitScoreBtn.textContent = 'Submitting...';
      const ok = await submitScoreToSupabase(nm, pendingScoreToSubmit);
      if (ok) {
        submitStatus.textContent = 'Submitted!';
        if (isExistingBestPrompt) localStorage.flappyBestPrompted = '1';
        setTimeout(closeScoreModal, 700);
      } else {
        submitStatus.textContent = 'Could not submit - check connection.';
        submitScoreBtn.disabled = false;
        submitScoreBtn.textContent = 'Retry';
      }
    };
    skipScoreBtn.onclick = (e) => {
      e.stopPropagation();
      if (isExistingBestPrompt) localStorage.flappyBestPrompted = '1';
      closeScoreModal();
    };

    leaderboardBtn.onclick = async (e) => {
      e.stopPropagation();
      leaderboardList.textContent = 'Loading...';
      leaderboardModal.style.display = 'flex';
      const entries = await fetchLeaderboard();
      if (!entries) {
        leaderboardList.textContent = 'Could not load leaderboard - check connection.';
        return;
      }
      if (!entries.length) {
        leaderboardList.textContent = 'No scores yet - be the first!';
        return;
      }
      leaderboardList.innerHTML = entries.map((en, i) =>
        '<div class="lb-row"><span>#' + (i + 1) + ' ' + (en.name || 'Player') +
        '</span><span>' + en.score + '</span></div>'
      ).join('');
    };
    closeLeaderboardBtn.onclick = (e) => { e.stopPropagation(); leaderboardModal.style.display = 'none'; };
    /* -------------------- AUDIO: quiet music bus + punchy sfx bus -------------------- */
    let ac, musicBus, sfxBus, muted = false;
    const MUSIC_VOL = 0.08, SFX_VOL = 0.30;
    function initAudio() {
      if (ac) return;
      ac = new (window.AudioContext || window.webkitAudioContext)();
      musicBus = ac.createGain();
      sfxBus = ac.createGain();
      musicBus.gain.value = MUSIC_VOL;
      sfxBus.gain.value = SFX_VOL;
      musicBus.connect(ac.destination);
      sfxBus.connect(ac.destination);
    }
    function sfx(freq, dur, type = 'square', slide = 0) {
      if (!ac || muted) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(1, freq + slide), t + dur);
      g.gain.setValueAtTime(1, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur);
    }
    function musicNote(freq, dur, type, vol) {
      if (!ac || muted || !freq) return;
      const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.02);
      g.gain.setValueAtTime(vol, t + dur * 0.6);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur);
    }
    const sndFlap = () => sfx(620, 0.08, 'square', 180);
    const sndScore = () => { sfx(880, 0.07, 'square'); setTimeout(() => sfx(1180, 0.09, 'square'), 65); };
    const sndHit = () => { sfx(180, 0.18, 'sawtooth', -110); sfx(90, 0.30, 'triangle'); };
    const MELODY = [330, 392, 440, 392, 330, 262, 294, 294, 349, 330, 294, 262, 262, 0];
    let melIndex = 0, nextNoteAt = 0;
    function playMusic() {
      if (!ac || muted || ac.currentTime < nextNoteAt) return;
      const n = MELODY[melIndex % MELODY.length];
      musicNote(n, 0.34, 'triangle', 0.6);
      musicNote(n / 2, 0.34, 'square', 0.12);
      melIndex++;
      nextNoteAt = ac.currentTime + 0.30;
    }
    function restartMusic() {
      if (!ac) return;
      const t = ac.currentTime;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setValueAtTime(MUSIC_VOL, t);
      melIndex = 0;
      nextNoteAt = t;
    }
    function fadeMusic() {
      if (!ac) return;
      const t = ac.currentTime;
      musicBus.gain.cancelScheduledValues(t);
      musicBus.gain.setValueAtTime(musicBus.gain.value, t);
      musicBus.gain.linearRampToValueAtTime(0, t + 0.4);
    }
    /* -------------------- BIRD --------------------
     * Two flap frames (wing-down = pixel-identical to the reference; wing-up
     * raises the wing with the YELLOW body drawn behind it, so no holes show).
     * Each frame is pre-baked to an offscreen canvas of true logical pixels.
     * Up/down motion ROTATES that crisp sprite (smoothing off) so it is never
     * stretched.
     */
    const BIRD_PX = 3;
    const BIRD_PALETTE = {
      K: '#000000', P: '#000000',
      Y: '#f7ce29', D: '#de9e14',
      W: '#ffffff', O: '#f68234', R: '#e52b1e'
    };
    const BIRD_FRAME_GRIDS = [
      [
        "......KKKKKK.....",
        "....KKYYYYKWK....",
        "...KYYYYYKWWWK...",
        ".KKKKYYYYKWWKWK..",
        "KWWWWKYYYKWWKWK..",
        "KWWWWWKYYYKWWWK..",
        "KYWWWYKYYYYKKKKK.",
        ".KYYYKYYYYKRRRRRK",
        "..KKKDDDDKRKKKKK.",
        "....KOODDDKRRRRK.",
        ".....KKDDDDKKKKK.",
        ".......KKKK......"
      ],
      [
        "......KKKKKK.....",
        ".KKKKKYYYYKWK....",
        "KWWWWKYYYKWWWK...",
        "KWWWWWYYYKWWKWK..",
        "KYWWWYYYYKWWKWK..",
        ".KYYYYKYYYKWWWK..",
        ".KYYYYKYYYYKKKKK.",
        ".KYYYKYYYYKRRRRRK",
        "..KKKDDDDKRKKKKK.",
        "....KOODDDKRRRRK.",
        ".....KKDDDDKKKKK.",
        ".......KKKK......"
      ]
    ];
    function bakeFrame(grid) {
      const cols = grid[0].length, rows = grid.length;
      const off = document.createElement('canvas');
      off.width = cols * BIRD_PX;
      off.height = rows * BIRD_PX;
      const oc = off.getContext('2d');
      oc.imageSmoothingEnabled = false;
      for (let cy = 0; cy < rows; cy++) {
        for (let cx = 0; cx < cols; cx++) {
          const color = BIRD_PALETTE[grid[cy][cx]];
          if (!color) continue;
          oc.fillStyle = color;
          oc.fillRect(cx * BIRD_PX, cy * BIRD_PX, BIRD_PX, BIRD_PX);
        }
      }
      return off;
    }
    const BIRD_SPRITES = BIRD_FRAME_GRIDS.map(bakeFrame);
    function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }
    function bird() {
      let target;
      if (mode === 0) target = 0;
      else target = clamp(v * 0.09, -0.32, 0.85);
      birdAngle += (target - birdAngle) * (1 - Math.pow(1 - 0.25, dt));
      const sprite = BIRD_SPRITES[Math.floor(frame / 6) % 2];
      q.save();
      q.translate(66, y);
      q.rotate(birdAngle);
      q.imageSmoothingEnabled = false;
      q.drawImage(sprite, -sprite.width / 2, -sprite.height / 2);
      q.restore();
    }
    /* -------------------- TOYOTA BRANDING --------------------
     * The emblem is the REAL logo, traced pixel-by-pixel from the source image:
     * red pixels were detected and mapped to a 60x39 logical grid. It is
     * baked once to an offscreen canvas, then drawn scaled down with smoothing
     * for a clean, accurate mark - no hand-drawn ellipses, no embedded PNG.
     */
    const TOYOTA_COLS = 60;
    const TOYOTA_ROWS = 39;
    const TOYOTA_GRID = [
      "000000000000000000000001111111111111100000000000000000000000",
      "000000000000000000111111111111111111111111000000000000000000",
      "000000000000000111111111111111111111111111111000000000000000",
      "000000000000011111111000000011110000000111111110000000000000",
      "000000000001111110000000000111111000000000111111100000000000",
      "000000000111111000000000001111111100000000000111111000000000",
      "000000001111110000000000011111111110000000000011111110000000",
      "000000111111100000000000011111111110000000000001111111000000",
      "000001111111100000000000111110011111000000000001111111100000",
      "000011111111100000000000111100001111000000000001111111110000",
      "000111111111100000000000111000000111000000000011111111111000",
      "000111101111111000000001111000000111100000000111111101111100",

    function drawCar() {
      const cellSize = CAR_DISPLAY_W / CAR_COLS;
      const carH = CAR_ROWS * cellSize;
      const cx = W - CAR_DISPLAY_W - 8;
      // Anchored to the canvas BOTTOM (not the grass top), so the car
      // sits low in the bottom-right corner with only its very top edge
      // just grazing the grass line - matching the original placement.
      // Any extra height beyond the canvas bottom is simply clipped by
      // the canvas edge (no visual artifact), same as before.
      const cy = H - carH + 6;
      q.save();
      for (const [rx, ry, rw, letter] of CAR_RUNS) {
        q.fillStyle = CAR_PALETTE[letter];
        q.fillRect(cx + rx * cellSize, cy + ry * cellSize, rw * cellSize, cellSize);
      }
      q.restore();
    }
    function drawBranding() {
      // Bottom-left area: "Powered by" text comes FIRST (leftmost), the
      // Toyota logo sits immediately after it - reading left-to-right.
      const logoW = 48;
      const logoH = Math.round(logoW * TOYOTA_ROWS / TOYOTA_COLS);
      const ly = H - logoH - 6;
      const textX = 8;
      const textY = Math.round(ly + logoH / 2);
      // Crisp "Powered by": integer baseline + hard 1px drop-shadow.
      q.save();
      q.font = '600 14px Arial';
      q.textAlign = 'left';
      q.textBaseline = 'middle';
      q.fillStyle = 'rgba(0, 0, 0, 0.55)';
      q.fillText('Powered by', textX + 1, textY + 1);
      q.fillStyle = '#ffffff';
      q.fillText('Powered by', textX, textY);
      const textW = q.measureText('Powered by').width;
      q.restore();
      // Smooth downscale of the traced emblem for an accurate, clean logo.
      const lx = Math.round(textX + textW + 6);
      q.save();
      q.imageSmoothingEnabled = true;
      q.imageSmoothingQuality = 'high';
      q.drawImage(TOYOTA_SPRITE, lx, ly, logoW, logoH);
      q.restore();
    }
    /* -------------------- SCENERY -------------------- */
    /* -------------------- DAY / NIGHT CYCLE (GRADUAL) --------------------
     * The target phase flips every 100 points (0-99 day, 100-199 night,
     * 200-299 day, ...). Instead of snapping instantly, `nightAmount` is a
     * continuous 0(day)-1(night) value that EASES toward that target every
     * frame, so the sky/sun-moon/stars/clouds all cross-fade smoothly.
     *
     * >>> NIGHT_TRANSITION_SPEED is the single knob for how fast that fade
     * happens. It's a "per-frame catch-up rate" (0 to 1):
     *   - LOWER value  (e.g. 0.006) = slower, more gradual, longer fade.
     *   - HIGHER value (e.g. 0.05)  = faster, snappier transition.
     *   - 1                          = effectively instant (old hard-cut look).
     * At the default 0.015, the fade takes roughly 5-6 real seconds.
     */
    const NIGHT_TRANSITION_SPEED = 0.015;
    let nightAmount = 0;
    function nightTarget() { return (Math.floor(score / 100) % 2 === 1) ? 1 : 0; }

      const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
      const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
      const r = Math.round(ar + (br - ar) * t), g = Math.round(ag + (bg - ag) * t), bl = Math.round(ab + (bb - ab) * t);
      return 'rgb(' + r + ',' + g + ',' + bl + ')';
    }
    const STARS = Array.from({ length: 45 }, () => ({
      x: Math.random() * W,
      y: Math.random() * (H - GND - 30),
      r: 0.6 + Math.random() * 1.3,
      tw: Math.random() * Math.PI * 2
    }));
    function sky() {
      const t = nightAmount;
      const g = q.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, lerpHex('#4ec0e0', '#0a0e24', t));
      g.addColorStop(0.6, lerpHex('#70c5ce', '#1a2247', t));
      g.addColorStop(1, lerpHex('#b6e6c9', '#33395f', t));
      q.fillStyle = g; q.fillRect(0, 0, W, H);
      // Stars fade in as night approaches.
      if (t > 0.01) {
        for (const s of STARS) {
          const tw = 0.55 + 0.45 * Math.sin(frame * 0.04 + s.tw);
          q.fillStyle = 'rgba(255,255,255,' + (tw * 0.9 * t).toFixed(2) + ')';
          q.beginPath(); q.arc(s.x, s.y, s.r, 0, 7); q.fill();
        }
      }
      // Sun and moon cross-fade in place at the same spot.
      if (t < 0.99) {
        q.globalAlpha = 1 - t;
        q.fillStyle = 'rgba(255, 247, 186, 0.85)';
        q.beginPath(); q.arc(56, 64, 27, 0, 7); q.fill();
        q.globalAlpha = 1;
      }
      if (t > 0.01) {
        q.globalAlpha = t;
        q.fillStyle = 'rgba(232,234,255,0.95)';
        q.beginPath(); q.arc(56, 64, 24, 0, 7); q.fill();
        q.fillStyle = 'rgba(180,185,215,0.55)';
        q.beginPath(); q.arc(48, 56, 4.5, 0, 7); q.fill();
        q.beginPath(); q.arc(63, 70, 3.2, 0, 7); q.fill();
        q.beginPath(); q.arc(58, 54, 2.4, 0, 7); q.fill();
        q.globalAlpha = 1;
      }
    }
    function cloud(o) {
      const t = nightAmount;
      const r = Math.round(255 + (205 - 255) * t), g2 = Math.round(255 + (210 - 255) * t), b = Math.round(255 + (235 - 255) * t);
      const a = 0.85 + (0.45 - 0.85) * t;
      q.fillStyle = 'rgba(' + r + ',' + g2 + ',' + b + ',' + a.toFixed(2) + ')';
      q.beginPath();
      q.arc(o.x, o.y, o.r, 0, 7);
      q.arc(o.x + o.r, o.y + 4, o.r * 0.8, 0, 7);
      q.arc(o.x - o.r, o.y + 4, o.r * 0.7, 0, 7);
      q.fill();
    }
    function pipe(p) {
      const capH = 18, capOver = 4;
      const g = q.createLinearGradient(p.x, 0, p.x + PW, 0);
      g.addColorStop(0, '#347516'); g.addColorStop(0.3, '#79c948'); g.addColorStop(0.5, '#a6e86d');
      g.addColorStop(0.7, '#79c948'); g.addColorStop(1, '#285b10');
      const seg = (yTop, h) => {
        q.fillStyle = g; q.fillRect(p.x, yTop, PW, h);
        q.fillStyle = 'rgba(255,255,255,0.25)'; q.fillRect(p.x + 7, yTop, 5, h);
        q.fillStyle = 'rgba(0,0,0,0.18)'; q.fillRect(p.x + PW - 7, yTop, 7, h);
      };
      const cap = (yTop) => {
        q.fillStyle = g; q.fillRect(p.x - capOver, yTop, PW + capOver * 2, capH);
        q.fillStyle = 'rgba(255,255,255,0.3)'; q.fillRect(p.x - capOver, yTop, PW + capOver * 2, 4);
        q.fillStyle = 'rgba(0,0,0,0.25)'; q.fillRect(p.x - capOver, yTop + capH - 3, PW + capOver * 2, 3);
      };
      seg(0, p.g - capH); cap(p.g - capH);
      seg(p.g + GAP + capH, H - (p.g + GAP + capH)); cap(p.g + GAP);
    }
    function ground(off) {
      const gy = H - GND;
      q.fillStyle = '#c8b45a'; q.fillRect(0, gy, W, GND);
      q.fillStyle = '#ded895'; q.fillRect(0, gy, W, 6);
      q.fillStyle = '#70bd3e'; q.fillRect(0, gy - 4, W, 8);
      q.fillStyle = '#4f9227';
      // NOTE: uses the same "off" (== SPD-scaled scroll) as everything
      // else, so grass moves in lockstep with the pipes.
      for (let i = -1; i < W / 13 + 1; i++) {
        const gx = ((i * 13 - off) % (W + 13) + W + 13) % (W + 13) - 13;
        q.beginPath(); q.moveTo(gx, gy); q.lineTo(gx + 4, gy - 6); q.lineTo(gx + 7, gy); q.fill();
      }
      q.fillStyle = 'rgba(0,0,0,0.08)';
      for (let i = 0; i < W / 20; i++) {
        const dx = ((i * 20 - off) % (W + 20) + W + 20) % (W + 20);
        q.fillRect(dx, gy + 18 + ((i * 7) % 20), 4, 4);
      }
    }
    /* -------------------- GAME FLOW -------------------- */
    function reset() {
      y = H / 2; v = 0; score = 0; mode = 0; shake = 0; birdAngle = 0;
      pipes = [0, 150, 300].map((d) => ({ x: W + d, g: 65 + Math.random() * (H - GND - 260), scored: false }));
      clouds = [0, 1, 2, 3].map(() => ({ x: Math.random() * W, y: 30 + Math.random() * 130, r: 13 + Math.random() * 12, s: 0.2 + Math.random() * 0.25 }));
      restartMusic();
    }
    function flap() {
      initAudio();
      if (ac.state === 'suspended') ac.resume();
      if (mode === 2) { reset(); mode = 1; restartMusic(); }
      else if (mode === 0) { mode = 1; restartMusic(); }
      v = FLAP; sndFlap();
    }
    function die() {
      if (mode !== 1) return;
      mode = 2; shake = 9;
      best = Math.max(best, score);
      localStorage.flappyBest = best;
      sndHit(); fadeMusic();
      // Give the score modal a beat after the hit effects, then let the
      // player submit to the shared leaderboard.
      if (score > 0) setTimeout(() => openScoreModal(score), 450);
    }
    addEventListener('keydown', (e) => {
      // Don't hijack Space (or any key) while the player is typing their
      // name into the modal input - otherwise a space in their name, or
      // just pressing Space to type, would also flap/restart the game.
      if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
      if (e.code === 'Space') { e.preventDefault(); flap(); }
    });
    cv.addEventListener('mousedown', flap);
    cv.addEventListener('touchstart', (e) => { e.preventDefault(); flap(); }, { passive: false });
    function loop(now) {
      /* -------------------- DELTA-TIME NORMALIZATION --------------------
       * requestAnimationFrame fires at whatever refresh rate the display/
       * browser gives us (60Hz, 90Hz, 120Hz, or throttled way down on a
       * background/low-power tab) - NOT a fixed rate. Without this, every
       * per-frame increment below (gravity, pipe speed, scroll, etc.) would
       * run faster or slower depending purely on hardware. `dt` expresses
       * elapsed real time as a multiple of one 60fps frame (~16.67ms), so
       * at 120Hz dt~=0.5 and at 30fps dt~=2, keeping actual game speed
       * constant everywhere. Capped at 3 to avoid big jumps after the tab
       * was backgrounded.
       */
      if (lastTime === null) lastTime = now;
      dt = Math.min((now - lastTime) / (1000 / 60), 3);
      lastTime = now;
      frame += dt;
      nightAmount += (nightTarget() - nightAmount) * (1 - Math.pow(1 - NIGHT_TRANSITION_SPEED, dt));
      const sx = shake ? (Math.random() - 0.5) * shake : 0;
      const sy = shake ? (Math.random() - 0.5) * shake : 0;
      shake *= Math.pow(0.84, dt);
      q.save(); q.translate(sx, sy);
      sky();
      for (const o of clouds) {
        if (mode !== 2) o.x -= o.s * dt;
        if (o.x < -40) o.x = W + 35;
        cloud(o);
      }
      for (const p of pipes) {
        if (mode === 1) {
          p.x -= SPD * dt;
          if (p.x + PW < 0) { p.x += 450; p.g = 65 + Math.random() * (H - GND - 260); p.scored = false; }
          if (!p.scored && p.x + PW < 66) { p.scored = true; score++; sndScore(); }
        }
        pipe(p);
        if (66 + 10 > p.x && 66 - 10 < p.x + PW && (y - 10 < p.g || y + 10 > p.g + GAP)) die();
      }
      if (mode === 1) { v += GRAVITY * dt; y += v * dt; gOff += SPD * dt; playMusic(); }
      if (y + 11 > H - GND) { y = H - GND - 11; die(); }
      if (y < 11) { y = 11; v = 0; }
      ground(gOff);
      bird();
      q.textAlign = 'center';
      q.fillStyle = '#fff';
      q.strokeStyle = 'rgba(0,0,0,0.45)';
      q.lineWidth = 4;
      q.font = 'bold 40px Arial';
      q.strokeText(score, W / 2, 58); q.fillText(score, W / 2, 58);
      q.font = '16px Arial';
      if (mode === 0) {
        q.strokeText('Tap / Space to start', W / 2, H / 2 + 90);
        q.fillText('Tap / Space to start', W / 2, H / 2 + 90);
      }
      if (mode === 2) {
        q.fillStyle = 'rgba(0,0,0,0.35)'; q.fillRect(40, H / 2 - 70, W - 80, 150);
        q.fillStyle = '#fff';
        q.font = 'bold 26px Arial'; q.fillText('Game Over', W / 2, H / 2 - 30);
        q.font = '16px Arial';
        q.fillText('Score: ' + score, W / 2, H / 2);
        q.fillText('Best: ' + best, W / 2, H / 2 + 24);
        q.fillText('Tap / Space to retry', W / 2, H / 2 + 56);
      }
      drawCar();
      drawBranding();
      q.restore();
      requestAnimationFrame(loop);
    }
    reset();
    requestAnimationFrame(loop);
    // Fire the one-time "submit your existing best" check shortly after
    // load (small delay so it doesn't visually collide with the canvas
    // still settling into place on first paint).
    setTimeout(maybePromptExistingBest, 600);
  </script>
</body>
</html>
